<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Reset your Job Portal password.">
    <title>Forgot Password | Job Portal</title>
    <link rel="icon" type="image/jpeg" href="pic/logo.jpg">
    <link rel="stylesheet" href="login.css">
</head>

<body>
    <input type="checkbox" id="show" checked>

    <div class="container">
        <h1>Reset Password</h1>
        <form action="login.html">
            <label for="reset-email">Email or Phone</label>
            <input type="text" id="reset-email" autocomplete="username">
            <button type="submit">Send Reset Link</button>
            <div class="link"><a href="login.html">Back to Login</a></div>
        </form>
    </div>
</body>

</html>
