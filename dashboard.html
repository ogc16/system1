<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Dashboard with recent jobs.">
    <title>Job Dashboard | Job Portal</title>
    <link rel="icon" type="image/jpeg" href="pic/logo.jpg">
    <link rel="stylesheet" href="style.css" />
    <!-- Font Awesome Cdn Link -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" />
</head>

<body>
    <div class="container">
        <nav id="app-nav" aria-label="Main navigation"></nav>

            <main class="main">
                <div class="main-top">
                    <p>Explore the universe!</p>
                </div>
                <div class="main-body">
                    <h1>Recent Jobs</h1>

                    <div class="search_bar">
                        <input type="search" id="job-search" placeholder="Search job here..." aria-label="Search jobs">
                        <select id="job-category" aria-label="Filter by category">
                            <option>Category</option>
                            <option>Programming</option>
                            <option>Design</option>
                            <option>PHP</option>
                            <option>JavaScript</option>
                        </select>
                        <select id="job-filter" class="filter" aria-label="Filter by recency">
                            <option value="">Filter</option>
                            <option value="3">Last 3 days</option>
                            <option value="5">Last 5 days</option>
                        </select>
                    </div>

                    <div class="tags_bar">
                        <div class="tag" data-tag="programming">
                            <i class="fas fa-times" aria-hidden="true"></i>
                            <span>Programming</span>
                        </div>
                        <div class="tag" data-tag="design">
                            <i class="fas fa-times" aria-hidden="true"></i>
                            <span>Design</span>
                        </div>
                        <div class="tag" data-tag="php">
                            <i class="fas fa-times" aria-hidden="true"></i>
                            <span>PHP</span>
                        </div>
                        <div class="tag" data-tag="javascript">
                            <i class="fas fa-times" aria-hidden="true"></i>
                            <span>JavaScript</span>
                        </div>
                    </div>

                    <div class="row">
                        <p>Showing <span id="job-count">8</span> Jobs</p>
                        <a href="jobs.html">See all</a>
                    </div>

                    <div id="job-list" class="job-list" aria-live="polite" aria-busy="true"></div>

                    <div id="no-results" class="empty-state" hidden>
                        <i class="fas fa-search" aria-hidden="true"></i>
                        <p>No jobs match your current filters.</p>
                        <button type="button" class="tag" id="clear-filters">Clear Filters</button>
                    </div>
                </div>
            </main>
        </div>

    <script src="jobs.js"></script>
    <script src="job-filters.js"></script>
    <script src="layout.js"></script>
</body>

</html>
