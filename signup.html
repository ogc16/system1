<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Create an account on the Job Portal.">
    <title>Sign Up | Job Portal</title>
    <link rel="icon" type="image/jpeg" href="pic/logo.jpg">
    <link rel="stylesheet" href="login.css">
</head>

<body>
    <input type="checkbox" id="show">
    <label for="show" class="show-btn">Log In / Sign Up</label>

    <div class="container">
        <label for="show" class="close-btn" title="close">×</label>
        <h1>Welcome</h1>
        <form action="dashboard.html" method="post">
            <label for="signup-phone">Phone</label>
            <input type="tel" id="signup-phone" autocomplete="tel">
            <label for="signup-email">Email</label>
            <input type="email" id="signup-email" autocomplete="email">
            <label for="signup-password">Password</label>
            <input type="password" id="signup-password" autocomplete="new-password">
            <button type="submit">Sign Up</button>
            <div class="link">Already a member? <a href="login.html">Log in here</a></div>
        </form>
    </div>
</body>

</html>
