<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Log in or sign up to the Job Portal.">
    <title>Log In | Job Portal</title>
    <link rel="icon" type="image/jpeg" href="pic/logo.jpg">
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <input type="checkbox" id="show">
    <label for="show" class="show-btn">Log In / Sign Up</label>

    <div class="container">
        <label for="show" class="close-btn" title="close">×</label>
        <h1>Welcome</h1>
        <form action="dashboard.html">
            <label for="login-email">Email or Phone</label>
            <input type="text" id="login-email" autocomplete="username">
            <label for="login-password">Password</label>
            <input type="password" id="login-password" autocomplete="current-password">
            <a href="forgot-password.html">Forgot Password?</a>
            <button type="submit">Submit</button>
            <div class="link">Not a member? <a href="signup.html">Signup here</a></div>
        </form>
    </div>

    <script>
        (function () {
            var form = document.querySelector('form');
            if (!form) { return; }
            form.addEventListener('submit', function () {
                var email = document.getElementById('login-email');
                var name = '';
                if (email && email.value) { name = email.value.split('@')[0]; }
                try {
                    localStorage.setItem('portal.user', JSON.stringify({ name: name }));
                } catch (e) { /* storage unavailable */ }
            });
        })();
    </script>
</body>

</html>
